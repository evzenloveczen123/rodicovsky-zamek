name: Release

# Push a tag like v1.0.0 to build the APK and publish a GitHub release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo prebuild --platform android --no-install
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "CN=evzenloveczen123" signature.txt
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "rodicovsky-zamek-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          files: rodicovsky-zamek-*.apk
          generate_release_notes: true
          body: |
            ## Instalace
            Stáhněte APK níže a otevřete ho v telefonu s Androidem 8 nebo novějším. Postup nastavení je v [README](https://github.com/${{ github.repository }}#jak-to-funguje).

            Aktualizace: nové APK stačí nainstalovat přes starou verzi, nastavení a PIN zůstanou.

            Otisk podpisového certifikátu (SHA-256):
            `3d:ce:36:f1:e2:1e:a4:1a:08:a3:22:20:f6:c0:68:b4:c4:43:fa:86:a0:a7:e2:07:ca:8b:0b:fe:aa:09:9f:8c`
