name: 🐞 Chyba
description: Něco nefunguje, jak má
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Díky za nahlášení! **Pokud jste našli způsob, jak zámek obejít, nehlaste ho tady**, ale soukromě podle [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Co se stalo
      description: Co jste dělali, co jste čekali a co se stalo místo toho.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Postup
      placeholder: |
        1. Zapnout zámek na 30 min
        2. Otevřít …
        3. …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Telefon
      placeholder: např. Xiaomi Redmi Note 12, HyperOS 1.0
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Verze Androidu
      placeholder: např. 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verze aplikace
      placeholder: např. 1.0.0
  - type: textarea
    id: extra
    attributes:
      label: Další informace
      description: Snímky obrazovky, log (`adb logcat`)…
